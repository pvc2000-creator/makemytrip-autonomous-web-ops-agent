<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Ops Agent · MakeMyTrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF; --panel:#FFFFFF; --panel-2:#F6F8F7; --ink:#17212B; --muted:#5E6A73; --line:#D6DCDD;
  --route:#2356A8; --route-soft:#DCE6F5; --amber:#B97C0C; --amber-soft:#F8ECD2; --red:#B8432F; --red-soft:#F6DFD9;
  --green:#2F7D55; --green-soft:#DAEEE2; --focus:#2356A8;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181D; --panel:#1A2228; --panel-2:#1F2830; --ink:#E7ECEE; --muted:#95A2AB; --line:#2E3A42;
  --route:#7FA7E8; --route-soft:#22324A; --amber:#E0A93D; --amber-soft:#3A2F17; --red:#E07A63; --red-soft:#3D221D;
  --green:#6CC495; --green-soft:#1C3527; --focus:#7FA7E8;}}
:root[data-theme="dark"]{
  --bg:#12181D; --panel:#1A2228; --panel-2:#1F2830; --ink:#E7ECEE; --muted:#95A2AB; --line:#2E3A42;
  --route:#7FA7E8; --route-soft:#22324A; --amber:#E0A93D; --amber-soft:#3A2F17; --red:#E07A63; --red-soft:#3D221D;
  --green:#6CC495; --green-soft:#1C3527; --focus:#7FA7E8;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--route)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font:700 20px/1.1 var(--cond);letter-spacing:.2px;padding:0 10px 18px}
.brand small{display:block;font:500 13px var(--sans);color:var(--muted);margin-top:4px}
.rail button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.rail button:hover{background:var(--panel-2)}
.rail button[aria-current="page"]{background:var(--route-soft);color:var(--route);font-weight:600}
.rail button:focus-visible{outline:2px solid var(--focus)}
.count{font:600 13px var(--cond);background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:0 7px}
.rail .foot{margin-top:auto;font-size:13px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.rail .foot label{display:block;margin-top:8px}
.rail select{width:100%;margin-top:3px;padding:5px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1280px;width:100%;min-width:0}
h1{font:700 30px/1.15 var(--cond);margin:0 0 4px}
h2{font:600 19px/1.3 var(--sans);margin:0 0 12px}
h3{font:600 15px/1.3 var(--sans);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px;max-width:72ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.gplan{grid-template-columns:2fr 1fr}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--route);border-color:var(--route);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#fff}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* stats strip: figures in condensed type */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,45%),1fr));border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:16px}
.stat{padding:14px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font:600 30px/1 var(--cond)}
.stat span{color:var(--muted);font-size:13px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
.num{font-family:var(--cond);font-size:16px;font-weight:600;white-space:nowrap}
.chip{display:inline-block;font:600 12.5px/1.6 var(--sans);padding:0 8px;border-radius:10px;white-space:nowrap;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.chip.completed,.chip.material-good{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.pending_review,.chip.awaiting_approval,.chip.review{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.failed,.chip.material{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.running{background:var(--route-soft);color:var(--route);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:13px}
.url{font-size:13px;color:var(--muted);word-break:break-all}
/* route strip */
.route{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 20px 16px;margin-bottom:16px;overflow-x:auto}
.route ol{list-style:none;margin:0;padding:0;display:flex;min-width:760px;position:relative}
.route li{flex:1;position:relative;text-align:center;font:600 14px/1.2 var(--cond);color:var(--muted);padding-top:26px}
.route li::before{content:"";position:absolute;top:8px;left:0;right:0;height:3px;background:var(--line)}
.route li:first-child::before{left:50%}
.route li:last-child::before{right:50%}
.route li::after{content:"";position:absolute;top:2px;left:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--line)}
.route li.done{color:var(--ink)}
.route li.done::before{background:var(--route)}
.route li.done::after{background:var(--route);border-color:var(--route)}
.route li.now{color:var(--route)}
.route li.now::before{background:linear-gradient(90deg,var(--route) 50%,var(--line) 50%)}
.route li.now::after{border-color:var(--route);box-shadow:0 0 0 5px var(--route-soft);animation:pulse 1.4s ease-in-out infinite}
.route li.halt::after{border-color:var(--amber);background:var(--amber)}
.route li.fail::after{border-color:var(--red);background:var(--red)}
.route li.halt{color:var(--amber)} .route li.fail{color:var(--red)}
.route li small{display:block;font:500 12px var(--sans);color:var(--muted);margin-top:3px}
.loopnote{margin-top:12px;font-size:13px;color:var(--route);display:flex;gap:6px;align-items:center}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.route li.now::after{animation:none}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--route)}
.tabs button:focus-visible{outline:2px solid var(--focus)}
.log{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:520px;overflow:auto;background:var(--panel-2);border-radius:6px;padding:10px 12px}
.log div{padding:2px 0;display:grid;grid-template-columns:70px 64px 1fr;gap:8px}
@media (max-width:860px){.log div{grid-template-columns:62px 1fr}.log div span:nth-child(2){display:none}}
.log .k-warning{color:var(--amber)} .log .k-error{color:var(--red)} .log .k-state{color:var(--route)}
.conf{display:inline-flex;align-items:center;gap:6px}
.conf i{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.conf i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c)}
.headline{font:600 24px/1.25 var(--cond);margin:0 0 10px}
.summary ul{margin:6px 0 14px;padding-left:20px}
.summary li{margin:3px 0}
.flag{border-left:3px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:14px}
.flag.bad{border-color:var(--red);background:var(--red-soft)}
.flag.ok{border-color:var(--green);background:var(--green-soft)}
form.intake{display:grid;gap:14px;max-width:760px}
form.intake label{display:grid;gap:5px;font-weight:600}
form.intake .hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;font-weight:500!important}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{display:grid;grid-template-columns:34px 130px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);font:600 15px var(--cond);color:var(--muted)}
.tool{font:600 14px var(--cond);color:var(--route)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.mode{font-size:12.5px;border-radius:5px;padding:6px 8px;background:var(--panel-2);margin-bottom:6px}
.market{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.menu{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.rail{position:fixed;inset:0 auto 0 0;width:250px;z-index:5;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  nav.rail.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.3)}
  .menu{display:inline-block;margin-bottom:14px}
  .pair,.gplan{grid-template-columns:1fr}
  .stat{border-bottom:1px solid var(--line)}
  h1{font-size:26px}
  .steps li{grid-template-columns:28px 1fr}.steps li span:last-child{grid-column:2}
}

/* live browser */
.livegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.browser{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.browser .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.urlbar{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewport{aspect-ratio:1280/800;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.viewport img,.viewport iframe{width:100%;height:100%;object-fit:contain;border:0;display:block}
.viewport .placeholder{color:var(--muted);padding:30px;text-align:center;max-width:46ch}
.livecap{margin:10px 2px 6px;font:600 17px/1.35 var(--cond);min-height:1.4em}
.replay{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.replay input{flex:1}
.stepl{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto}
.stepl li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.stepl li:last-child{border-bottom:0}
.stepl .ic{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.stepl li[data-st=done] .ic{background:var(--green);border-color:var(--green)}
.stepl li[data-st=running] .ic{border-color:var(--route);box-shadow:0 0 0 4px var(--route-soft);animation:pulse 1.4s infinite}
.stepl li[data-st=failed] .ic{background:var(--red);border-color:var(--red)}
.stepl li[data-st=skipped] .ic,.stepl li[data-st=stopped] .ic{background:var(--line)}
.stepl li[data-st=running]{color:var(--route);font-weight:600}
.stepl .tl{font:600 13px var(--cond);color:var(--muted)}
.ctlbar{display:flex;gap:8px;flex-wrap:wrap}
.approval{border:2px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:14px;margin-bottom:12px}
.approval p{margin:6px 0 10px;font-weight:600}
.approval input{width:100%;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;padding:7px;background:var(--panel)}
.outcome{border-left:4px solid var(--green);background:var(--green-soft);padding:14px 16px;border-radius:0 8px 8px 0;margin-bottom:14px}
.outcome.no{border-color:var(--amber);background:var(--amber-soft)}
.outcome .ref{font:700 28px var(--cond);letter-spacing:1px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px}
.wall .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.wall .thumb{aspect-ratio:1280/800;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.wall .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.wall .meta{padding:10px 12px}
.wall .meta .cap{font-size:13px;color:var(--muted);margin-top:3px;min-height:2.6em}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:20px;max-width:440px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog label{display:flex;gap:8px;align-items:center;margin:10px 0}
dialog select{width:auto}
.kind{font:600 12px var(--sans);padding:0 7px;border-radius:9px;background:var(--route-soft);color:var(--route)}
.kind.transaction{background:var(--amber-soft);color:var(--amber)}
@media (max-width:980px){.livegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Main">
    <div class="brand">Web Ops Agent<small>MakeMyTrip growth &amp; operations</small></div>
    <button data-view="dashboard">Operations overview</button>
    <button data-view="wall">Live browsers <span class="count" id="liveCount" hidden style="background:var(--route-soft);color:var(--route)"></span></button>
    <button data-view="tasks">Workflows</button>
    <button data-view="new">New workflow</button>
    <button data-view="runs">Run history</button>
    <button data-view="review">Review queue <span class="count" id="reviewCount" hidden></span></button>
    <a id="sitesLink" href="/mock" target="_blank" rel="noopener" hidden style="padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;font-weight:500">Demo websites ↗</a>
    <div class="foot">
      <div class="mode" id="modeNote"></div>
      <label>Acting as
        <select id="role"><option value="admin">Administrator</option><option value="creator">Task creator</option><option value="reviewer">Reviewer</option></select>
      </label>
      <label>Theme
        <select id="theme"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
      </label>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="runDlg"><form method="dialog"><h2 style="margin-top:0">Run options</h2>
<p class="small muted" id="runDlgName"></p>
<label>Speed <select id="optSpeed"><option value="fast">Fast</option><option value="normal" selected>Normal</option><option value="slow">Slow (easy to follow)</option></select></label>
<label><input type="checkbox" id="optHeaded"> Also open a visible Chrome window on this computer</label>
<label><input type="checkbox" id="optStep"> Step through one action at a time</label>
<p class="small muted">The live browser view in this app works either way. A visible window needs the backend on the same computer.</p>
<div class="row"><button class="btn primary" value="go" id="runDlgGo">Start run</button><button class="btn" value="cancel">Cancel</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   Shared pipeline definitions (mirrors backend/extraction + agents)
   ===================================================================== */
const STATES = ["task_intake","plan_generated","awaiting_approval","browser_execution","awaiting_input","extraction","comparison","reasoning","completion"];
const STATE_LABEL = {task_intake:"Intake",plan_generated:"Plan",awaiting_approval:"Approval",awaiting_input:"Your approval",stopped:"Stopped",browser_execution:"Browse",extraction:"Extract",comparison:"Compare",reasoning:"Reason",completion:"Complete",completed:"Completed",pending_review:"Needs review",failed:"Failed"};
const TERMINAL = new Set(["completed","pending_review","failed","stopped"]);
const TEMPLATE_LABEL = {hotel_booking:"Hotel booking",train_availability:"Train seat availability",activity_listings:"Activities and tours",review_watch:"Hotel reviews watch",advisory_watch:"Travel advisory watch",flight_booking:"Flight booking",flight_fares:"Flight fare search",hotel_listings:"Hotel search and filter",book_listings:"Catalogue scan",custom:"Custom steps",competitor_offers:"Competitor offers",hotel_pricing:"Hotel pricing",campaign_page:"Campaign page",partner_updates:"Partner updates",travel_trends:"Travel trends"};
const F=(selectors,o={})=>({selectors,attr:o.attr||null,kind:o.kind||"text",required:o.required!==false});
const SCHEMAS = {
  competitor_offers:{item:[".offer-card","[data-offer]","article.deal"],entity:["competitor","offer_name"],compare:["price","discount","validity","cta"],fields:{
    competitor:F(["[data-competitor]"],{attr:"data-competitor"}),offer_name:F([".offer-title",".deal-name","h3"]),destination:F([".destination","[data-destination]"]),
    price:F([".price",".deal-price","[data-price]"],{kind:"price"}),discount:F([".discount",".badge"],{required:false}),validity:F([".validity","time"],{kind:"date",required:false}),cta:F([".cta","a.button","button"],{required:false})}},
  hotel_pricing:{item:[".hotel",".property-card","[data-hotel]"],entity:["city","hotel","stay_date"],compare:["price","availability"],fields:{
    hotel:F([".hotel-name",".property-title","h3"]),city:F(["[data-city]"],{attr:"data-city"}),stay_date:F(["[data-stay-date]"],{attr:"data-stay-date",kind:"date"}),
    price:F([".price",".rate-amount","[data-rate]"],{kind:"price"}),availability:F([".availability",".rooms-left",".status"],{kind:"availability"}),occupancy:F([".occupancy"],{required:false})}},
  campaign_page:{item:["main","body"],entity:["campaign"],compare:["headline","offer_text","cta","placement","validity"],page:true,fields:{
    campaign:F(["[data-campaign]"],{attr:"data-campaign"}),headline:F(["h1.headline","h1"]),offer_text:F([".offer-text",".hero p"]),cta:F([".cta","a.button"]),
    placement:F(["[data-position]"],{attr:"data-position",required:false}),validity:F([".validity"],{kind:"date",required:false})}},
  partner_updates:{item:["article.update",".update-item"],entity:["partner","title"],compare:["content","published"],fields:{
    partner:F(["[data-partner]"],{attr:"data-partner"}),title:F(["h3",".update-title"]),published:F(["time"],{attr:"datetime",kind:"date"}),content:F(["p",".body"]),category:F([".category"],{required:false})}},
  travel_trends:{item:["tr.signal",".trend-row"],entity:["destination"],compare:["search_index","event"],fields:{
    destination:F([".dest","td:nth-of-type(1)"]),search_index:F([".index","td:nth-of-type(2)"],{kind:"int"}),event:F([".event","td:nth-of-type(3)"],{required:false}),trend:F([".trend","td:nth-of-type(4)"],{required:false})}},
};
const OWNERS={competitor_offers:"Growth",hotel_pricing:"Pricing & Revenue",campaign_page:"Marketing Ops",partner_updates:"Partner Ops",travel_trends:"Business Strategy"};

/* =====================================================================
   Demo backend: runs the same pipeline in the browser when no API is reachable
   ===================================================================== */
const Demo = (() => {
  const CFG={allow:["demo-sources.mmt.internal"],minConf:0.7,priceThr:3,trendThr:15,maxRetries:2};
  const BASE="https://demo-sources.mmt.internal";
  const db={tasks:[],plans:[],runs:[],events:[],records:[],comparisons:[],summaries:[],feedback:[],snapshots:[],tick:0};
  let evId=0;
  const id=p=>p+"_"+Math.random().toString(16).slice(2,12);

const Poller={timer:null,token:0};

function startRunPolling(runId){
  stopPolling();const my=++Poller.token;
  const tick=async()=>{
    if(my!==Poller.token)return;
    if(document.hidden){Poller.timer=setTimeout(tick,2000);return}
    let r;try{r=await GET(`/api/runs/${runId}`)}catch{Poller.timer=setTimeout(tick,3000);return}
    if(my!==Poller.token||App.view!=="run"||App.param!==runId)return;
    const done=TERMINAL.has(r.state)||r.state==="awaiting_approval";
    if(App.tab==="live")await loadLive(runId);
    if(my!==Poller.token)return;
    if(sig(r)!==sig(App.cur)){
      App.cur=r;
      if(App.tab==="live"){patchRunHeader(r)}else{await paintRun()}}
    if(done){if(App.tab==="live")await loadLive(runId);stopPolling();refreshBadge();if(App.tab==="live")await paintRun();return}

  const lbl={summary:"Summary",changes:`Changes (${r.comparisons.filter(c=>c.classification==="material").length})`,records:`Records (${r.records.length})`,log:`Activity log (${r.events.length})`,evidence:`Snapshots (${r.snapshots.length})`};
  document.querySelectorAll("[data-tab]").forEach(b=>{if(lbl[b.dataset.tab])b.textContent=lbl[b.dataset.tab]});const rs=$("#routeWrap");if(rs)rs.innerHTML=routeStrip(r);const st=$("#runStats");if(st)st.outerHTML=runStats(r);bind($("#main").querySelector("#runHead")||document.createElement("div"))}

async function loadLive(runId,reset){
  if(reset||App.liveRun!==runId){App.frames=[];App.follow=true;App.liveRun=runId}
  const since=App.frames.length?App.frames.at(-1).seq:0;
  let lv;try{lv=await GET(`/api/runs/${runId}/live?since=${since}`)}catch{return}
  if(App.liveRun!==runId)return;

function frameSrc(f){return f.html!=null?null:`/api/runs/${App.liveRun}/frames/${f.seq}.jpg`}
function showFrame(i){const f=App.frames[i];const v=$("#lvView");if(!f||!v)return;
  if(f.html!=null){let fr=v.querySelector("iframe");if(!fr){v.innerHTML='<iframe sandbox="" title="Captured page"></iframe>';fr=v.querySelector("iframe")}if(fr.dataset.seq!=String(f.seq)){fr.srcdoc=f.html;fr.dataset.seq=f.seq}}

    const src=frameSrc(f);if(img.getAttribute("src")!==src){const pre=new Image();pre.onload=()=>{img.src=src};pre.src=src}}
  $("#lvUrl").textContent=f.url||"";$("#lvCap").textContent=f.caption||"";
  const sl=$("#lvSlider");if(sl){sl.max=App.frames.length-1;sl.value=i;$("#lvCount").textContent=`Frame ${i+1} of ${App.frames.length}`}}
function updateLive(){const lv=App.lv;if(!lv||!$("#lvView"))return;

  else{$("#lvView").innerHTML=`<div class="placeholder">${lv.live===false&&!TERMINAL.has(lv.state)?"Waiting for the browser to start…":App.live?"No browser frames for this run. Runs using the HTTP engine don't produce frames; install Chromium with: python -m playwright install chromium":"Starting…"}</div>`;

  const ol=$("#lvSteps");if(ol&&lv.steps&&lv.steps.length){
    if(ol.children.length!==lv.steps.length)ol.innerHTML=lv.steps.map((st,i)=>`<li data-i="${i}" data-st="${st.status}"><span class="ic"></span><span><span class="tl">${esc(st.tool.replace(/_/g," "))}</span> ${esc(st.purpose)}</span></li>`).join("");

  const c=lv.control, running=!!c;

function routeStrip(r){
  const needsApproval=r.plan&&(r.plan.approved_by!=="auto (non-sensitive)"||r.state==="awaiting_approval");
  const usedInput=r.state==="awaiting_input"||r.events.some(e=>e.message==="State -> awaiting_input");
  const stops=STATES.filter(s=>(s!=="awaiting_approval"||needsApproval)&&(s!=="awaiting_input"||usedInput));
  const seen=new Set(r.events.filter(e=>e.kind==="state").map(e=>e.message.replace("State -> ","").split(" ")[0]));
  const idx=stops.indexOf(r.state);const term=TERMINAL.has(r.state);
  const rerun=r.events.some(e=>e.message.startsWith("Reasoning loop:"));
  const items=stops.map((s,i)=>{let cls="";
    if(term&&r.state!=="failed")cls="done";
    else if(r.state==="failed"||r.state==="stopped"){cls=seen.has(s)?"done":"";}
    else if(i<idx)cls="done";else if(i===idx)cls=s==="awaiting_approval"||s==="awaiting_input"?"halt":"now";
    const time=r.events.find(e=>e.kind==="state"&&e.message.startsWith("State -> "+s));
    return`<li class="${cls}">${STATE_LABEL[s]}${time?`<small>${clock(time.at)}</small>`:""}</li>`});
  const endCls=r.state==="failed"||r.state==="stopped"?"fail":r.state==="pending_review"?"halt":r.state==="completed"?"done":"";
  items.push(`<li class="${endCls}">${term?STATE_LABEL[r.state]:"Finish"}${r.finished_at?`<small>${clock(r.finished_at)}</small>`:""}</li>`);
  if(r.state==="failed"||r.state==="stopped"){const last=[...stops].reverse().find(s=>seen.has(s));const i=stops.indexOf(last);items[i]=items[i].replace('class="done"','class="fail"')}
  return`<div class="route" aria-label="Run progress"><ol>${items.join("")}</ol>${rerun?`<div class="loopnote">↺ The reasoning agent sent the run back to the browser once because a source returned nothing that had data last time.</div>`:""}</div>`}

  <div class="row">${chip(r.state)}${App.live&&r.summary?`<a class="btn small" href="/api/runs/${r.id}/export.csv">Download CSV</a>`:""}<button class="btn small" data-start="${r.task_id}" ${TERMINAL.has(r.state)?"":"disabled"}>Run again</button></div></div>`}

VIEWS.run=async(id,pre)=>{const r=pre||await GET(`/api/runs/${id}`);App.cur=r;if(App.tab==="auto"||!TABS[App.tab])App.tab=TERMINAL.has(r.state)?"summary":"live";

  return`${runHead(r)}
  <div id="routeWrap">${routeStrip(r)}</div>
  ${runStats(r)}
  ${r.state==="awaiting_approval"?`<div class="flag"><b>This plan needs approval before the browser runs.</b> Review the steps in the Plan tab. <div class="row" style="margin-top:8px"><button class="btn primary small" data-approve="${r.plan_id}">Approve plan and run</button><button class="btn warn small" data-reject="${r.plan_id}">Reject plan</button></div></div>`:""}
  ${r.error?`<div class="flag bad"><b>Run failed.</b> ${esc(r.error)}. Check the activity log, fix the source or schema, then run again.</div>`:""}
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${App.tab===k}" data-tab="${k}">${l}</button>`).join("")}</div>
  <div id="tabBody">${TABS[App.tab](r)}</div>`};

const TABS={};
TABS.live=r=>`<div class="livegrid"><div>
  <div class="browser"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><div class="urlbar" id="lvUrl"></div></div>
  <div class="viewport" id="lvView"><div class="placeholder">Connecting to the browser…</div></div></div>
  <div class="livecap" id="lvCap" aria-live="polite"></div>
  <div class="replay"><input type="range" id="lvSlider" min="0" max="0" value="0" aria-label="Replay frames"><span id="lvCount"></span><button class="btn small" data-live="latest">Latest</button></div></div>
  <div><div class="approval" id="lvApproval" hidden></div>
  <div class="panel" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Controls</h3><span class="small muted" id="lvStatus"></span></div><div class="ctlbar" id="lvCtl"></div></div>
  <div class="panel"><h3>Steps</h3><ol class="stepl" id="lvSteps">${(r.plan?.steps||[]).map((s,i)=>`<li data-i="${i}" data-st="${TERMINAL.has(r.state)?"done":"pending"}"><span class="ic"></span><span><span class="tl">${esc(s.tool.replace(/_/g," "))}</span> ${esc(s.purpose)}</span></li>`).join("")}</ol></div></div></div>`;
TABS.summary=r=>{const s=r.summary;if(!s)return`<div class="panel empty">${TERMINAL.has(r.state)?"This run ended before a summary was produced.":"The summary appears when the run completes."}</div>`;const b=s.body;
  const fbDone=r.feedback.some(f=>f.target_type==="summary");
  const o=r.outcome||{};const outcome=b.kind==="transaction"?(o.booking_ref?`<div class="outcome"><div class="small">Booking reference</div><div class="ref">${esc(o.booking_ref)}</div><div>${o.chosen_hotel?`${esc(o.chosen_hotel)} · ${esc(o.chosen_room||"")} · ${esc(o.nights||"")} nights for ${esc(o.guest_name||"")}`:`${esc(o.origin||"")} to ${esc(o.destination||"")} on ${esc(o.date||"")} for ${esc(o.traveller_name||"")}`} · total <b>${esc(o.total||"")}</b></div><div class="small muted">${o.chosen_hotel?"Cheapest matching hotel and room":`Chosen: ${esc(o.chosen_option||"")} (cheapest of ${esc(o.options_compared||"?")})`}</div></div>`
    :`<div class="outcome no"><b>Not booked.</b> ${esc(o.declined||"The run ended before confirming.")}</div>`):"";
  return`<div class="panel summary"><p class="headline">${esc(s.headline)}</p>${outcome}
  ${b.needs_human_confirmation?`<div class="flag"><b>Confirm before external action.</b><ul style="margin:6px 0 0">${b.review_reasons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:`<div class="flag ok">No review flags on this run.</div>`}
  <div class="grid g2"><div><h3>What changed</h3><ul>${b.what_changed.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${b.what_changed.length>12?`<p class="small muted">${b.what_changed.length-12} more in the Changes tab.</p>`:""}
  <h3>Why it matters</h3><p style="margin-top:0">${esc(b.why_it_matters)}</p></div>
  <div><h3>Owner</h3><p style="margin-top:0">${esc(b.owner)}</p><h3>Recommended actions</h3><ul>${(b.recommended_actions.length?b.recommended_actions:["No action needed"]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h3>Delivered to</h3><p style="margin-top:0">${s.alerts.length?s.alerts.map(a=>`<span class="chip ${a.channel==="review_queue"?"review":a.priority==="high"?"material":""}" style="margin:0 6px 6px 0">${esc(a.channel.replace("_"," "))}: ${esc(a.team)}</span>`).join(""):"Dashboard only"}</p>
  <h3>Record mix</h3><p class="small" style="margin-top:0">${b.counts.records} records · ${b.counts.material} material · ${b.counts.noise} noise · ${b.counts.formatting} formatting-only · ${b.counts.missing_data} missing data · average confidence ${Math.round(b.confidence*100)}%</p></div></div>
  ${b.evidence.length?`<h3>Evidence</h3><div class="wrap"><table><tbody>${b.evidence.slice(0,10).map(e=>`<tr><td>${esc(e.statement)}</td><td class="url">${esc(shortUrl(e.source_url))}</td><td>${conf(e.confidence)}</td></tr>`).join("")}</tbody></table></div>`:""}
  <div class="row" style="margin-top:16px">${fbDone?`<span class="muted small">Reviewer decision recorded: ${esc(r.feedback.filter(f=>f.target_type==="summary").at(-1).verdict)}.</span>`:
   `<button class="btn primary" data-fb="summary:${s.id}:accepted">Accept summary</button><button class="btn warn" data-fb="summary:${s.id}:rejected">Reject summary</button>`}
   <span class="small muted">Generated by the ${esc(s.generator)} writer from extracted records.</span></div></div>`};
TABS.changes=r=>{if(!r.comparisons.length)return`<div class="panel empty">${r.summary?.headline?.startsWith("Baseline")?"This run is the baseline. Move the market forward and run again to see changes.":"No changes compared with the previous run."}</div>`;
  const order={material:0,missing_data:1,noise:2,formatting:3};const cs=[...r.comparisons].sort((a,b)=>order[a.classification]-order[b.classification]);
  return`<div class="panel wrap"><table><thead><tr><th>Entity</th><th>Change</th><th>Field</th><th>Before</th><th>After</th><th>Move</th><th>Class</th><th>Confidence</th></tr></thead><tbody>
  ${cs.map(c=>`<tr><td>${esc(c.entity)}<div class="url">${esc(shortUrl(c.source_url))}</div></td><td>${esc(c.change_type.replace(/_/g," "))}</td><td>${esc(c.field||"")}</td><td>${cval(c.before)}</td><td>${cval(c.after)}</td>
   <td class="num" style="color:${c.delta_pct>0?"var(--red)":c.delta_pct<0?"var(--green)":"inherit"}">${c.delta_pct!=null?(c.delta_pct>0?"+":"")+c.delta_pct.toFixed(1)+"%":""}</td><td><span class="chip ${c.classification==="material"?"material":c.classification==="missing_data"?"review":""}">${esc(c.classification.replace("_"," "))}</span></td><td>${conf(c.confidence)}</td></tr>`).join("")}</tbody></table>
  <p class="small muted">Price moves under the threshold count as noise. Same value in a different format (₹ 7,499 vs INR 7499) counts as formatting-only.</p></div>`};
TABS.records=r=>{if(!r.records.length)return`<div class="panel empty">No records yet.</div>`;const fields=Object.keys(r.records[0].fields);const fb=Object.fromEntries(r.feedback.filter(f=>f.target_type==="record").map(f=>[f.target_id,f.verdict]));
  return`<div class="panel wrap"><table><thead><tr>${fields.map(f=>`<th>${esc(f.replace("_"," "))}</th>`).join("")}<th>Confidence</th><th>Validation notes</th><th>Reviewer</th></tr></thead><tbody>
  ${r.records.map(x=>`<tr>${fields.map(f=>`<td>${fval(x.fields[f])}</td>`).join("")}<td>${conf(x.confidence)}</td><td class="small">${x.validation_notes.length?x.validation_notes.map(esc).join("<br>"):'<span class="muted">none</span>'}</td>
  <td>${fb[x.id]?`<span class="chip ${fb[x.id]==="accepted"?"completed":"failed"}">${fb[x.id]}</span>`:`<div class="row" style="flex-wrap:nowrap"><button class="btn small" data-fb="record:${x.id}:accepted" aria-label="Accept record">Accept</button><button class="btn small warn" data-fb="record:${x.id}:rejected" aria-label="Reject record">Reject</button></div>`}</td></tr>`).join("")}</tbody></table></div>`};
TABS.plan=r=>{const p=r.plan;return`<div class="grid gplan"><div class="panel"><h2>Planned steps</h2><ol class="steps">${p.steps.map(s=>`<li><span class="tool">${esc(s.tool.replace("_"," "))}</span><span>${esc(s.purpose)}${s.target?`<div class="url">${esc(s.target)}</div>`:""}</span></li>`).join("")}</ol></div>
  <div class="panel"><h3>Risks</h3><ul class="small" style="padding-left:18px">${p.risks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h3>Approval</h3><p class="small">${esc(p.status)}${p.approved_by?` by ${esc(p.approved_by)}`:""}</p></div></div>`};
TABS.log=r=>`<div class="panel"><div class="log" id="log">${r.events.map(e=>`<div class="k-${e.kind}"><span>${clock(e.at)}</span><span>${esc(e.kind)}</span><span>${esc(e.message)}</span></div>`).join("")}</div></div>`;
TABS.evidence=r=>r.snapshots.length?`<div class="panel wrap"><table><thead><tr><th>Page</th><th>Title</th><th>Status</th><th>Content hash</th><th></th></tr></thead><tbody>${r.snapshots.map(s=>`<tr><td class="url">${esc(s.url)}</td><td>${esc(s.page_title)}</td><td class="num">${s.http_status}</td><td class="small">${esc(s.content_hash.slice(0,12))}</td>
  <td class="row" style="flex-wrap:nowrap"><button class="btn small" data-snap="${s.id}">View HTML</button>${App.live&&s.has_screenshot?`<a class="btn small" target="_blank" href="/api/snapshots/${s.id}/screenshot">Screenshot</a>`:""}</td></tr>`).join("")}</tbody></table><pre id="snapView" class="log" hidden style="white-space:pre-wrap;margin-top:12px"></pre></div>`:`<div class="panel empty">No pages captured.</div>`;

/* =====================================================================
   Events
   ===================================================================== */
function bind(root){
  root.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});
  root.querySelectorAll("[data-run]").forEach(b=>b.onclick=e=>{e.preventDefault();go("run",b.dataset.run,"auto")});
  root.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>go("plan",b.dataset.plan));
  root.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>openRunDialog(b.dataset.start,b.dataset.name||""));
  root.querySelectorAll("[data-ctl]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await POST(`/api/runs/${App.cur.id}/control`,{action:b.dataset.ctl});toast({pause:"Paused",resume:"Resumed",step:"Running one action",stop:"Stopping"}[b.dataset.ctl]);await loadLive(App.cur.id)}catch(e){toast(errText(e));b.disabled=false}});
  root.querySelectorAll("[data-input]").forEach(b=>b.onclick=async()=>{const ok=b.dataset.input==="approve";root.querySelectorAll("[data-input]").forEach(x=>x.disabled=true);
    try{await POST(`/api/runs/${App.cur.id}/input`,{approve:ok,note:($("#lvNote")||{}).value||null});toast(ok?"Approved. The agent is continuing.":"Not approved. The agent will stop before confirming.");await loadLive(App.cur.id)}catch(e){toast(errText(e))}});
  root.querySelectorAll("[data-live]").forEach(b=>b.onclick=()=>{App.follow=true;showFrame(App.frames.length-1)});
  const sl=root.querySelector("#lvSlider");if(sl)sl.oninput=()=>{App.follow=+sl.value===App.frames.length-1;showFrame(+sl.value)};
  root.querySelectorAll("[data-sched]").forEach(s=>s.onchange=async()=>{try{await PATCH(`/api/tasks/${s.dataset.sched}`,{schedule:s.value});toast(`Schedule set to ${s.value}`)}catch(e){toast(errText(e))}});
  root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{App.tab=b.dataset.tab;root.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));$("#tabBody").innerHTML=TABS[App.tab](App.cur);bind($("#tabBody"));if(App.tab==="live")loadLive(App.cur.id,true)});
  root.querySelectorAll("[data-approve],[data-reject]").forEach(b=>b.onclick=async()=>{try{await POST(`/api/plans/${b.dataset.approve||b.dataset.reject}/approve`,{approve:!!b.dataset.approve});toast(b.dataset.approve?"Plan approved":"Plan rejected");stopPolling();await render()}catch(e){toast(errText(e))}});
  root.querySelectorAll("[data-fb]").forEach(b=>b.onclick=async()=>{const[t,id,v]=b.dataset.fb.split(":");b.disabled=true;try{await POST("/api/feedback",{run_id:App.cur.id,target_type:t,target_id:id,verdict:v});toast(`${t==="summary"?"Summary":"Record"} ${v}`);App.cur=await GET(`/api/runs/${App.cur.id}`);await paintRun()}catch(e){b.disabled=false;toast(errText(e))}});
  root.querySelectorAll("[data-snap]").forEach(b=>b.onclick=async()=>{const pre=$("#snapView");pre.hidden=false;pre.textContent=await GET(`/api/snapshots/${b.dataset.snap}/html`)});
  root.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{const a=b.dataset.act;
    if(a==="menu"){$("#rail").classList.toggle("open");return}
    if(a==="advance"){const s=await POST("/mock/advance");toast(`Market moved to day ${s.tick}`);render()}
    if(a==="runall"){const ts=await GET("/api/tasks");let n=0;for(const t of ts){if((wfOf(t.template)||{}).kind==="transaction")continue;try{await POST("/api/runs",{task_id:t.id,options:savedOpts()});n++}catch{}}toast(`Started ${n} run(s)`);await render();if(App.view==="dashboard")startDashboardPolling()}});
  const form=root.querySelector("#intake");if(form){const sel=form.template;
    const upd=()=>{const w=wfOf(sel.value)||{};$("#wfDesc").textContent=w.description||"";
      $("#wfInputs").innerHTML=(w.inputs||[]).map(i=>`<label>${esc(i.label)}<input type="text" name="in_${i.name}" value="${esc(i.default||"")}" placeholder="${i.name==="date"?"Leave empty for two weeks from today":""}"></label>`).join("");
      const custom=sel.value==="custom";$("#stepsWrap").hidden=!custom;$("#urlsWrap").hidden=custom;form.urls.value=(w.default_urls||[]).join("\n");
      form.schedule.disabled=w.kind==="transaction";if(w.kind==="transaction")form.schedule.value="once";
      if(!form.objective.dataset.touched)form.objective.value=w.description||"";if(!form.name.dataset.touched)form.name.value=w.label||""};
    form.objective.oninput=()=>form.objective.dataset.touched=1;form.name.oninput=()=>form.name.dataset.touched=1;sel.onchange=upd;upd();
    form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form);const w=wfOf(f.get("template"))||{};const inputs={};
      for(const i of w.inputs||[])inputs[i.name]=f.get("in_"+i.name)||"";
      if(f.get("template")==="custom"){try{inputs.steps=JSON.parse(f.get("steps"))}catch(err){$("#formErr").innerHTML=`<div class="flag bad">Steps are not valid JSON: ${esc(err.message)}</div>`;return}
        const ex=inputs.steps.find(x=>x.tool==="extract"&&x.args&&x.args.schema);if(ex)inputs.schema=ex.args.schema}
      const body={name:f.get("name"),template:f.get("template"),objective:f.get("objective"),target_urls:(f.get("urls")||"").split(/\n+/).map(s=>s.trim()).filter(Boolean),
        schedule:w.kind==="transaction"?"once":(f.get("schedule")||"once"),owner_team:f.get("owner_team"),requires_approval:!!f.get("requires_approval"),inputs};
      try{const t=await POST("/api/tasks",body);toast("Workflow created");go("plan",t.id)}catch(err){$("#formErr").innerHTML=`<div class="flag bad">${esc(errText(err))}</div>`;window.scrollTo(0,0)}}}
  const l=$("#log");if(l)l.scrollTop=l.scrollHeight;
}
function savedOpts(){try{return JSON.parse(localStorage.getItem("runOpts"))||{speed:"normal",headed:false,step_mode:false}}catch{return{speed:"normal",headed:false,step_mode:false}}}
function openRunDialog(taskId,name){
  if(!App.live){POST("/api/runs",{task_id:taskId}).then(({run_id})=>{toast("Run started");go("run",run_id,"live")}).catch(e=>toast(errText(e)));return}
  const d=$("#runDlg"),o=savedOpts();$("#runDlgName").textContent=name;$("#optSpeed").value=o.speed||"normal";$("#optHeaded").checked=!!o.headed;$("#optStep").checked=!!o.step_mode;
  d.onclose=async()=>{if(d.returnValue!=="go")return;const opts={speed:$("#optSpeed").value,headed:$("#optHeaded").checked,step_mode:$("#optStep").checked};
    try{localStorage.setItem("runOpts",JSON.stringify({...opts,step_mode:false}))}catch{}
    try{const{run_id}=await POST("/api/runs",{task_id:taskId,options:opts});toast(opts.headed?"Run started. A Chrome window is opening on this computer.":"Run started");go("run",run_id,"live")}catch(e){toast(errText(e))}};
  d.returnValue="";d.showModal()}
document.querySelectorAll(".rail button[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));
$("#role").onchange=e=>{App.role=e.target.value;toast(`Acting as ${e.target.selectedOptions[0].text.toLowerCase()}`);render()};
$("#theme").onchange=e=>{try{e.target.value?document.documentElement.setAttribute("data-theme",e.target.value):document.documentElement.removeAttribute("data-theme");localStorage.setItem("theme",e.target.value)}catch{}};
try{const t=localStorage.getItem("theme");if(t){document.documentElement.setAttribute("data-theme",t);$("#theme").value=t}}catch{}

(async()=>{
  try{const c=new AbortController();setTimeout(()=>c.abort(),1500);const r=await fetch("/api/health",{signal:c.signal});const h=r.ok&&(r.headers.get("content-type")||"").includes("json")?await r.json():null;App.live=!!(h&&h.ok&&!h.demo);App.health=h}catch{App.live=false}
  $("#modeNote").innerHTML=App.live?`Connected to backend. Browser: ${App.health.playwright?"Chromium":"HTTP only (install Chromium for live view)"}. Model: ${App.health.llm?"on":"off"}.`:"Demo mode: the full pipeline runs in this page against bundled sample sources.";
  if(App.live)$("#sitesLink").hidden=false;
  try{App.workflows=await GET("/api/workflows");App.tools=await GET("/api/tools")}catch{App.workflows=[]}
  go("dashboard");
})();
</script>
</body>
</html>
