services:
  - type: web
    name: mmt-web-ops-agent
    runtime: docker
    dockerfilePath: deployment/docker/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DOMAIN_ALLOWLIST
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: SNAPSHOT_DIR
        value: /tmp/snapshots
